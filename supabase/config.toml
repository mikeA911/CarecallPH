# Supabase project configuration for CareCall.
# Deploy edge functions from this directory (the one containing `supabase/`)
# with the CLI so the shared `functions/_shared/lib.ts` module is bundled:
#   supabase functions deploy start-campaign
#
# project_id is the Supabase project ref (used by `supabase link`).
project_id = "fpoiparkhyiqxrcktshy"

# ---------------------------------------------------------------------------
# Edge functions
# `verify_jwt` gates the Supabase API gateway BEFORE the function runs.
#  - Portal-called functions keep it on and rely on the user JWT.
#  - Webhook/cron-called functions turn it off and enforce their own auth
#    (Telnyx secret header, or the service-role bearer check in code).
# ---------------------------------------------------------------------------

# Portal admin/user management — always called with a signed-in user JWT.
[functions.admin-manage]
verify_jwt = true

# Started by the staff portal AND by pg_cron (tick_active_campaigns) using the
# service-role bearer. The function validates the Authorization header itself,
# so the gateway check is disabled to allow the cron invocation through.
[functions.start-campaign]
verify_jwt = false

# Telnyx Call Control webhook — no Supabase JWT is present.
[functions.telnyx-call-events]
verify_jwt = false

# Telnyx AI Assistant tool webhooks — authenticated via x-carecall-secret.
[functions.assistant-tools]
verify_jwt = false

# Public self-service booking API (/book/<token>). No Supabase JWT — the patient
# is not a portal user. Guarded by the opaque token, per-token verification
# lockout, and a per-IP rate limit inside the function (self-booking-link-spec §4).
[functions.booking-api]
verify_jwt = false

# Public symptom check (/check, /check/<clinic>). No Supabase JWT: patients are
# not portal users. Per-IP rate limits, per-check and monthly engine budgets
# inside the function (docs/symptom-check-design.md §5).
[functions.symptom-check]
verify_jwt = false

# Public patient sign-up page (/join/<clinic>). No Supabase JWT: patients are
# not portal users. Per-IP rate limits inside the function.
[functions.patient-signup]
verify_jwt = false

# Appointment reminders, called every 5 minutes by pg_cron (tick_reminders)
# with the service-role bearer, checked inside the function.
[functions.send-reminders]
verify_jwt = false

# Care plans (consent requests, stop reminders): signed-in portal users only.
[functions.care-plan]
verify_jwt = true

# Staff portal "Invite to chat" — signed-in user JWT required.
[functions.channel-invite]
verify_jwt = true

# Viber / Messenger / WhatsApp / Telegram webhooks — authenticated by each
# platform's signature or secret header inside the function.
[functions.channel-webhook]
verify_jwt = false

[functions.fhir]
verify_jwt = true

[functions.clinical-note]
verify_jwt = true
